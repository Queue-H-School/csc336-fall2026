<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<title>IP Meta</title>

		<link rel="stylesheet" href="style.css">

		<!-- import leaflet-->
		<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
			  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
		<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
				integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

	</head>
	<body>
		<div id="headerDiv">
			<h1>CLOUDFLARE TRACE</h1>
			<p id="ipText" class="redText">- - - - -</p>
		</div>
		<div id="contentDiv">
			<div id="mapDiv"></div>
			<div id="infoDiv">
				<div id="datetimeDiv">
					<p id="date"></p>
					<p id="time" class="redText"></p>
				</div>
				<div id="deviceDiv" class="infoDiv">
					<p class="label">Device Information</p>
					<p id="device" class="redText"></p>
				</div>
				<div id="hostDiv" class="infoDiv">
					<p class="label">Host Information</p>
					<p id="location" class="redText"></p>
					<p id="organization"></p>
				</div>
				<div id="broswerDiv" class="infoDiv">
					<p class="label">Browser Information</p>
					<p id="bot"></p>
					<p id="tor"></p>
				</div>
			</div>
		</div>

		<script src="script.js"></script>
	</body>
</html>
