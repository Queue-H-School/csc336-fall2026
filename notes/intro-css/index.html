<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>9-15-26 CSS Demos</title>
        <style>
            /*
            css precedence is based on a ruletype algorithm, not order in the code
            (most to least specific) id -> class -> tag
            */

            div {
                background-color: #CCCCCC;
            }

            #contentArea {
                color: #000000
            }

            #titleArea {
                color: #008888
            }

            #flexDiv {
                display: flex;
                width: 100%;
                height: 100px
            }

            .flexdemo {
                background-color: #FF0000;
                height: 100%;
                width: 50%
            }

        </style>
    </head>
    <body>
        <div id="titleArea">
            <h1 id="title">Penguins</h1>
        </div>
        <div id="contentArea">
            <ul id="penguinNames">
                <li>Mike</li>
                <li>Lisa</li>
                <li>Jeff</li>
                <li>Phil</li>
            </ul>
        </div>
        <div id="flexDiv">
            <div class="flexdemo"></div>
            <div class="flexdemo"></div>
            <div class="flexdemo"></div>
            <div class="flexdemo"></div>
        </div>
    </body>
</html>
