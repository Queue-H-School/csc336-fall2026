<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<title>10-23 Fetch Api</title>
	</head>
	<body>
		<script>
            // fetch returns a promise
            let fetchResponse = fetch("https://dog.ceo/api/breeds/image/random");
            fetchResponse.then((data) => {
                console.log(data);
                // parse and return the data as js object
                return data.json();
            }).then((data) => {
                // refers to above promise
                console.log("json object");
                // parsed json data
                console.log(data);

                // display image
                bodyElement = document.querySelector("body");
                let dogImg = document.createElement("img");
                dogImg.src = data.message;
                bodyElement.appendChild(dogImg);
            });
		</script>

	</body>
</html>
