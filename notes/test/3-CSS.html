<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>CSS Demo from Class</title>

        <style>
            p {
                background-color: #00FFFF;
                margin: 4;
                border: 1px solid #000000;
            }

            div {
                background-color: #00FF00;
            }

            #first_div {
                background-color: #FF0000;
            }

            .small {
                width: 50;
            }

        </style>
    </head>
    <body>
        <p>top paragraph</p>
        <div id="first_div">bottom paragraph
            <img src="darcy-dog.jpeg" height="480"/></div>
        <div style="background-color: #0000FF;">bottom paragraph
            text <span><img class=small src="darcy-dog.jpeg"/></span> more text
        </div>
    </body>
</html>
